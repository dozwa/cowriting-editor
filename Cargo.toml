[workspace]
resolver = "2"
members = ["crates/core", "crates/backends", "crates/app", "src-tauri", "suites"]

[workspace.package]
version = "0.1.1-dev"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
