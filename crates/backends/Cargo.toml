[package]
name = "cowriting-backends"
description = "How the CoWriting Editor reaches a model: one interface, several providers"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cowriting-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["time", "process", "net", "io-util", "macros", "rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
