name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages the window needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - name: Interface, types and tests
        working-directory: ui
        run: |
          npm run build
          npm test
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Unsigned build
        run: ui/node_modules/.bin/tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: cowriting-editor-${{ matrix.os }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
          if-no-files-found: error

  goldens:
    # the goldens are the plugin's own output at a pinned commit; this fails when they no longer match it
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - id: pin
        run: echo "commit=$(cat fixtures/goldens/PLUGIN_COMMIT)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: dozwa/claude-cowriting
          ref: ${{ steps.pin.outputs.commit }}
          path: plugin-repo
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # TypeScript, to compile the plugin's hooks module
      - run: npm ci
        working-directory: ui
      - run: python3 scripts/make-goldens.py --plugin plugin-repo --check
