name: CI

# Work is on the branch `dev`; `main` is the state of the alpha that is out. A push to either, or
# a pull request, is checked and tested. The app is built only when the workflow is started by
# hand on `dev` (Actions → CI → Run workflow → Branch: dev, or `gh workflow run ci.yml --ref dev`),
# and what it builds is the dev app: "CoWriting Editor Dev", with its own settings, for the
# developer alone. Its installers hang on the run and are gone after 90 days. An alpha for testers
# is built by its tag on `main` (release.yml, DEVELOPING.md).
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages the window needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - name: Interface, types and tests
        working-directory: ui
        run: |
          npm run build
          npm test
      - name: One version in every file
        run: python3 scripts/set-version.py --check
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: pandoc and Typst, for the export and the installer
        run: python3 scripts/fetch-tools.py
      - run: cargo test --workspace
        env:
          COWRITING_NEED_TOOLS: 1
      - name: The dev app is built from a dev version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          version=$(python3 scripts/set-version.py --check)
          case "$version" in *-dev) ;; *) echo "::error::This is $version, not a dev version: start the workflow on the branch dev (gh workflow run ci.yml --ref dev). An alpha is built by its tag."; exit 1 ;; esac
      - name: The dev app, unsigned
        if: github.event_name == 'workflow_dispatch'
        run: ui/node_modules/.bin/tauri build
      - id: commit
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: cowriting-editor-dev-${{ steps.commit.outputs.short }}-${{ matrix.os }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
          if-no-files-found: error

  goldens:
    # the goldens are the plugin's own output at a pinned commit; this fails when they no longer match it
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - id: pin
        run: echo "commit=$(cat fixtures/goldens/PLUGIN_COMMIT)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: dozwa/claude-cowriting
          ref: ${{ steps.pin.outputs.commit }}
          path: plugin-repo
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # TypeScript, to compile the plugin's hooks module
      - run: npm ci
        working-directory: ui
      - run: python3 scripts/make-goldens.py --plugin plugin-repo --check
