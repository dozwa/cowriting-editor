name: Release

# A tag like v0.1.1-alpha on `main` builds the installers of the released app ("CoWriting Editor",
# not the dev app) for the three systems and puts them into a draft release, marked as a
# pre-release when the version is an alpha. The tag has to be the version the files hold, no dev
# version, and on a commit of `main`: an alpha is what `main` holds. With the signing secrets set
# (see RELEASING.md) the macOS and Windows installers are signed; without them the same installers
# are built unsigned.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Linux packages the window needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev libdbus-1-dev
      - name: The tag is the version in the files, no dev version, and on main
        shell: bash
        run: |
          python3 scripts/set-version.py --check "$GITHUB_REF_NAME"
          git fetch --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || { echo "::error::$GITHUB_REF_NAME is not on main. Merge the tried state of dev into main and tag there (DEVELOPING.md)."; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - name: pandoc and Typst for the installer
        run: python3 scripts/fetch-tools.py
      - name: Build, signed where the secrets are set
        shell: bash
        # a secret that is not set arrives as an empty value, and the bundler would try to sign with it
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          ui/node_modules/.bin/tauri build --config src-tauri/tauri.release.conf.json
        env:
          # macOS: Developer ID certificate and notarisation (empty when not set: unsigned build)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Put the installers into a draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in *-alpha) kind=--prerelease; title="Alpha ${version%-alpha}" ;; *) kind=; title="$version" ;; esac
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft $kind --title "$title" --notes "Draft: check the installers before publishing."
          shopt -s nullglob
          gh release upload "$GITHUB_REF_NAME" --clobber target/release/bundle/dmg/*.dmg target/release/bundle/nsis/*.exe target/release/bundle/appimage/*.AppImage target/release/bundle/deb/*.deb
