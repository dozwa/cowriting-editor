name: Release

# `main` is the state of the alpha, so a merge into `main` makes one. When `dev` is merged (by a
# pull request), this workflow
#   1. turns the dev version into the alpha's (0.1.1-dev → 0.1.1-alpha), moves the changelog's
#      entries under a heading of that version, commits that to `main` and tags it v0.1.1-alpha;
#   2. builds the installers of the released app ("CoWriting Editor", not the dev app) for the
#      three systems and puts them into a draft pre-release;
#   3. merges `main` back into `dev` and sets `dev` to the next dev version (0.1.2-dev).
# Nothing is published: the draft is looked at and published by hand. A push to `main` whose
# version is tagged already releases nothing. With the signing secrets set (see RELEASING.md) the
# macOS and Windows installers are signed; without them the same installers are built unsigned.
# With the key for updates (its public half in src-tauri/tauri.updater.conf.json, its private half
# the secret TAURI_SIGNING_PRIVATE_KEY) the release can update itself and be updated to: its files
# get signatures, and `latest.json` in the draft names them. Without the key `latest.json` names
# the version only: editors are told of it and it is installed by hand. Publishing the draft is
# what tells them (.github/workflows/updates.yml).
on:
  push:
    branches: [main]

permissions:
  contents: write

# one release at a time, and never a half one
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.alpha.outputs.tag }}
      is_new: ${{ steps.alpha.outputs.is_new }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The version, the changelog and the tag
        id: alpha
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/release.py alpha
      - name: Push them, and open the draft
        if: steps.alpha.outputs.is_new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.alpha.outputs.tag }}
        run: |
          git push origin HEAD:main "$TAG"
          version="${TAG#v}"
          case "$version" in *-alpha) kind=--prerelease; title="Alpha ${version%-alpha}" ;; *) kind=; title="$version" ;; esac
          gh release create "$TAG" --draft $kind --title "$title" --notes-file release-notes.md

  build:
    needs: version
    if: needs.version.outputs.is_new == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - name: Linux packages the window needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev libdbus-1-dev
      - name: The tag is the version in the files, and no dev version
        shell: bash
        run: python3 scripts/set-version.py --check "${{ needs.version.outputs.tag }}"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - name: pandoc and Typst for the installer
        run: python3 scripts/fetch-tools.py
      - name: Build, signed where the secrets are set
        shell: bash
        # a secret that is not set arrives as an empty value, and the bundler would try to sign with it
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          configs=(--config src-tauri/tauri.release.conf.json)
          # updates from inside the app: only with both halves of the key
          python=$(command -v python3 || command -v python)
          if [ "$("$python" scripts/latest-json.py key)" = yes ]; then
            if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
              echo "::error::src-tauri/tauri.updater.conf.json holds a public key for updates, but the secret TAURI_SIGNING_PRIVATE_KEY is not set. A release built without it could not be updated to."
              exit 1
            fi
            configs+=(--config src-tauri/tauri.updater.conf.json)
          else
            echo "::notice::No key for updates in src-tauri/tauri.updater.conf.json: this release cannot update itself (see RELEASING.md)."
            unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          fi
          ui/node_modules/.bin/tauri build "${configs[@]}"
        env:
          # updates: the private half of the key the files are signed with (empty when not set)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS: Developer ID certificate and notarisation (empty when not set: unsigned build)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Put the installers into the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          shopt -s nullglob
          gh release upload "$TAG" --clobber target/release/bundle/dmg/*.dmg target/release/bundle/nsis/*.exe target/release/bundle/appimage/*.AppImage target/release/bundle/deb/*.deb
          # what the updater fetches and checks: on macOS the app as an archive, and a signature beside every file (none without the key for updates)
          updates=(target/release/bundle/macos/*.app.tar.gz target/release/bundle/macos/*.app.tar.gz.sig target/release/bundle/nsis/*.exe.sig target/release/bundle/appimage/*.AppImage.sig target/release/bundle/deb/*.deb.sig)
          if [ ${#updates[@]} -gt 0 ]; then gh release upload "$TAG" --clobber "${updates[@]}"; fi

  updates:
    # what an installed editor learns of this release from: latest.json, made from the signatures of its files
    needs: [version, build]
    if: needs.version.outputs.is_new == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - name: latest.json into the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release view "$TAG" --json body --jq .body > notes.md
          if [ "$(python3 scripts/latest-json.py key)" = yes ]; then
            mkdir signatures
            gh release download "$TAG" --dir signatures --pattern '*.sig'
            python3 scripts/latest-json.py write --tag "$TAG" --signatures signatures --notes notes.md --out latest.json
          else
            echo "::notice::No key for updates: latest.json names the version and no files. Editors show it as newer; it is installed by hand."
            python3 scripts/latest-json.py write --tag "$TAG" --no-files --notes notes.md --out latest.json
          fi
          gh release upload "$TAG" --clobber latest.json

  dev:
    # dev goes on from the alpha, under the next number; the installers do not wait for it
    needs: version
    if: needs.version.outputs.is_new == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: dev takes main back and gets the next dev version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          python3 scripts/release.py dev
          git push origin HEAD:dev
